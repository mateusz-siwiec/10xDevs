# fly.io config for gym-track.
# Secrets expected at deploy time (set with `fly secrets set KEY=value`):
#   DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD, JWT_SECRET
# See src/main/resources/application.properties for the defaults these override.
#
# Flyway migrations (src/main/resources/db/migration) run on startup and Hibernate only
# validates the schema (ddl-auto=validate), same as locally and in CI. The Supabase DB must
# either be empty or already have a flyway_schema_history table - never a schema that
# Hibernate built without Flyway.

app = "gym-track-mateusz"
primary_region = "lhr"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
