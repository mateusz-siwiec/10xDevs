# Local development only - activate with SPRING_PROFILES_ACTIVE=local
# (or `./mvnw spring-boot:run -Dspring-boot.run.profiles=local`).
# This key is public in the repo and must never be used in production:
# the deployed app does not activate this profile and requires a real
# JWT_SECRET (`fly secrets set JWT_SECRET=...`).
JWT_SECRET=local-dev-only-signing-key-not-for-production-use-0123456789
