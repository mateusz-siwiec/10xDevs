# Netlify config for the SPA in frontend/.
# The backend runs on Fly.io; the API base URL is baked in at build time.

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  VITE_API_BASE_URL = "https://gym-track-mateusz.fly.dev"

# Client-side routing: serve index.html for every path that is not a real file.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
