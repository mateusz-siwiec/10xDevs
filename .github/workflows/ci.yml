name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Same credentials as podman-compose.yml / the backend's application.properties defaults.
env:
  DB_HOST: localhost
  DB_PORT: 5432
  DB_NAME: 10xDevs
  DB_USER: admin
  DB_PASSWORD: start123

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: 10xDevs
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: start123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d 10xDevs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: ./mvnw --batch-mode test

  frontend:
    name: Frontend build, lint and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: 10xDevs
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: start123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d 10xDevs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Playwright starts the backend (local profile) and the Vite dev server itself.
      - run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  deploy:
    name: Deploy to Fly.io
    # Runs only for pushes to main, after every check above has passed.
    needs: [backend, frontend, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      # Create with `fly tokens create deploy` and add it as a repository secret.
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Check for Fly.io token
        if: env.FLY_API_TOKEN == ''
        run: echo "::warning::FLY_API_TOKEN secret is not set - skipping deploy."
      - uses: actions/checkout@v4
        if: env.FLY_API_TOKEN != ''
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: env.FLY_API_TOKEN != ''
      - name: Deploy
        if: env.FLY_API_TOKEN != ''
        run: flyctl deploy --remote-only
      - name: Health check
        if: env.FLY_API_TOKEN != ''
        run: |
          for i in $(seq 1 12); do
            if curl -fsS https://gym-track-mateusz.fly.dev/api/health; then exit 0; fi
            echo "Waiting for the app to come up ($i/12)..."
            sleep 10
          done
          echo "::error::Health check failed after deploy"
          exit 1
