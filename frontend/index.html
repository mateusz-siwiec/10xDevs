<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#9d2ff5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="GymTrack" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>GymTrack</title>
    <style>
      #splash { position: fixed; inset: 0; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; background: #fff; color: #08060d; font: 600 1.5rem/1 system-ui, sans-serif; transition: opacity 0.3s ease; }
      #splash.splash-hide { opacity: 0; pointer-events: none; }
      #splash svg { width: 4rem; height: auto; animation: splash-pulse 1.2s ease-in-out infinite; }
      @keyframes splash-pulse { 50% { transform: scale(1.12); opacity: 0.7; } }
      @media (prefers-color-scheme: dark) { #splash { background: #16171d; color: #f3f4f6; } }
      @media (prefers-reduced-motion: reduce) { #splash svg { animation: none; } #splash { transition: none; } }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="GymTrack">
      <svg viewBox="0 0 64 64" fill="none" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#9d2ff5"/><rect x="13" y="29" width="38" height="6" rx="3" fill="#fff"/><rect x="14" y="19" width="7" height="26" rx="2.5" fill="#fff"/><rect x="43" y="19" width="7" height="26" rx="2.5" fill="#fff"/><rect x="7" y="25" width="5" height="14" rx="2" fill="#fff" fill-opacity=".75"/><rect x="52" y="25" width="5" height="14" rx="2" fill="#fff" fill-opacity=".75"/></svg>
      <span>GymTrack</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
