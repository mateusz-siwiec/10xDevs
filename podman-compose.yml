version: "3.9"

services:
  db:
    image: docker.io/library/postgres:16-alpine
    container_name: 10xdevs-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: 10xDevs
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: start123
    volumes:
      - 10xdevs-pgdata:/var/lib/postgresql/data

volumes:
  10xdevs-pgdata:
